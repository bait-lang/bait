name: Generate bootstrap

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'cli/bait.bt'
      - 'lib/**'

jobs:
  gen-bootstrap:
    if: github.repository == 'bait-lang/bait'
    runs-on: ubuntu-latest
    env:
      TIABEAST_BOT_TOKEN: ${{ secrets.TIABEAST_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Bootstrap
        run: |
          ./make.sh --no-self
      - name: Generate, commit and push latest bait.js and bait.c
        id: genCommitPush
        continue-on-error: true
        run: ./bait run cli/tools/gen-bootstrap.bt
      - name: Attempt to generate bootstrap on breaking change
        if: steps.genCommitPush.outcome == 'failure'
        run: bun ~/.bait/bootstrap/bait.js run cli/tools/gen-bootstrap.bt
